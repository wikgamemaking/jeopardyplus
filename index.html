<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy+</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#0b0a17;
    --panel:#191433;
    --panel-2:#201a44;
    --line: rgba(242,183,5,0.15);
    --gold:#f2b705;
    --magenta:#ff3d81;
    --cyan:#33e6cc;
    --purple:#7f77dd;
    --text:#f5f3ff;
    --muted:#9089b8;
  }

  *{ box-sizing: border-box; }
  *{ scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar{ display:none; width:0; height:0; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size:16px;
    min-height:100vh;
    position: relative;
    overflow-x: hidden;
  }

  .bg-glow{
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  }
  .bg-glow span{
    position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.11;
  }
  .bg-glow span:nth-child(1){ width: 380px; height: 380px; background: var(--magenta); top: -120px; left: -100px; animation: drift1 30s ease-in-out infinite; }
  .bg-glow span:nth-child(2){ width: 340px; height: 340px; background: var(--gold); bottom: -140px; right: -80px; animation: drift2 34s ease-in-out infinite; }
  .bg-glow span:nth-child(3){ width: 260px; height: 260px; background: var(--cyan); top: 40%; left: 60%; animation: drift3 38s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(50px,60px); } }
  @keyframes drift2{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(-55px,-40px); } }
  @keyframes drift3{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-30px,30px) scale(1.1); } }

  @keyframes fadeInUp{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes popIn{ from{ opacity:0; transform: scale(0.9); } to{ opacity:1; transform: scale(1); } }
  @keyframes modalPop{ from{ opacity:0; transform: scale(0.9) translateY(8px); } to{ opacity:1; transform: scale(1) translateY(0); } }
  @keyframes glowPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(242,183,5,0.4); border-color: var(--gold); }
    50%{ box-shadow: 0 0 0 6px rgba(242,183,5,0); border-color: var(--magenta); }
  }
  @keyframes cellDone{ from{ transform: scale(1); } 40%{ transform: scale(0.9) rotateY(90deg); opacity:0.3; } to{ transform: scale(1) rotateY(0); opacity:1; } }
  @keyframes shimmerTitle{ 0%{ background-position: 0% 50%; } 100%{ background-position: 200% 50%; } }
  @keyframes confettiFall{
    0%{ transform: translateY(-20px) rotate(0deg); opacity:1; }
    100%{ transform: translateY(220px) rotate(540deg); opacity:0; }
  }
  @keyframes scorePop{
    0%{ background: rgba(242,183,5,0.35); transform: scale(1); }
    50%{ transform: scale(1.06); }
    100%{ background: transparent; transform: scale(1); }
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,61,129,0.35); }
    70%{ box-shadow: 0 0 0 16px rgba(255,61,129,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,61,129,0); }
  }
  @keyframes skeletonShine{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #root{ max-width: 1220px; margin: 0 auto; padding: 22px 16px 60px; }

  .brand{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap: wrap; gap:12px;
    margin-bottom: 16px;
    animation: fadeInUp .5s ease both;
  }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 39px;
    letter-spacing: 0.3px;
    margin:0;
    background: linear-gradient(100deg, var(--gold), var(--magenta), var(--cyan), var(--gold));
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmerTitle 11s linear infinite;
  }
  .brand .tag{ color:var(--muted); font-size:15px; margin-top:3px; }
  .me-badge{
    display:flex; align-items:center; gap:9px;
    background: var(--panel); border:1px solid var(--line);
    border-radius: 999px; padding: 7px 18px 7px 7px;
    font-size:15px; cursor:pointer;
    transition: border-color .2s;
  }
  .me-badge:hover{ border-color: var(--gold); }

  .player-avatar{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px; font-weight:700; color:#1a1400;
    flex-shrink:0;
  }

  .room-bar{
    display:flex; align-items:center; justify-content:space-between; gap:11px; flex-wrap:wrap;
    background: var(--panel); border:1px solid var(--line); border-radius:10px;
    padding: 18px; margin-bottom: 14px; font-size:15px; color: var(--muted);
    animation: fadeInUp .5s ease .08s both;
  }
  .room-left, .room-right{ display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .room-code{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:18px;
    color: var(--gold); letter-spacing:2px; background: var(--panel-2);
    padding: 6px 12px; border-radius:6px;
  }
  .mode-pill{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:11px;
    text-transform:uppercase; letter-spacing:0.4px;
    padding:4px 10px; border-radius:999px;
    background: rgba(51,230,204,0.12); color: var(--cyan); border:1px solid rgba(51,230,204,0.3);
  }
  .mode-pill.duel{ background: rgba(255,61,129,0.12); color: var(--magenta); border-color: rgba(255,61,129,0.3); }
  .progress-text{ font-family:'IBM Plex Mono', monospace; color: var(--cyan); font-size:13px; }
  .copy-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:7px; padding:6px 12px 6px 9px; font-size:12px; cursor:pointer;
    transition: all .15s;
  }
  .copy-btn svg{ flex-shrink:0; width:14px; height:14px; }
  .copy-btn:hover{ color: var(--text); border-color: var(--gold); transform: translateY(-1px); }
  .copy-btn.copied{ color: var(--cyan); border-color: var(--cyan); }
  .room-code-wrap{ position:relative; display:inline-flex; }
  .room-code-hidden{
    filter: blur(6px);
    transition: filter .18s ease;
    cursor: pointer;
  }
  .room-code-hidden:hover, .room-code-hidden:focus-within{ filter: blur(0); }
  .room-code-reveal-hint{
    position:absolute; left:50%; bottom:-17px; transform: translateX(-50%);
    font-size:10px; color: var(--muted); white-space:nowrap; pointer-events:none;
    opacity:0; transition: opacity .15s;
  }
  .room-code-wrap:hover .room-code-reveal-hint{ opacity:1; }
  .leave-link{ color: var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; }
  .leave-link:hover{ color: var(--text); }

  .round-banner{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom: 12px; min-height: 34px;
    animation: fadeInUp .5s ease .1s both;
  }
  .round-label{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px;
    text-transform:uppercase; letter-spacing:0.4px; color: var(--muted);
  }
  .round-complete{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px;
    color: var(--gold);
  }
  .round-next-btn{ padding:7px 16px; font-size:13px; }

  .layout{ display:grid; grid-template-columns: 1fr 260px; gap: 22px; align-items:start; }
  @media (max-width: 860px){ .layout{ grid-template-columns: 1fr; } }

  .board-wrap{ overflow-x:auto; position: relative; animation: fadeInUp .5s ease .12s both; scrollbar-width: thin; padding-bottom: 4px; text-align:center; }
  .board-wrap::-webkit-scrollbar{ display:block; height:8px; }
  .board-wrap::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
  .board-wrap::-webkit-scrollbar-thumb:hover{ background: var(--gold); }
  .board.compact .cat{ font-size:12px; padding:12px 6px; }
  .board.compact .cell{ font-size:21px; height:88px; }
  .board{
    display:inline-grid;
    gap:7px;
    perspective: 800px;
    flex-shrink:0;
    text-align:left;
  }
  .cat{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    text-align:center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent, var(--gold));
    border-radius:9px;
    padding: 16px 9px;
    letter-spacing:0.3px;
    text-transform: uppercase;
    line-height:1.3;
    opacity:0;
    animation: popIn .4s ease forwards;
  }
  .cell{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius:9px;
    height: 100px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size: 27px;
    color: var(--gold);
    cursor:pointer;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    opacity:0;
    animation: popIn .35s ease forwards;
  }
  .cell:hover{ background: var(--panel-2); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
  .cell:active{ transform: translateY(0) scale(0.96); }
  .cell.done{
    color: var(--muted);
    background: transparent;
    border-style:dashed;
    cursor:default;
    opacity:.35 !important;
    animation: cellDone .45s ease;
  }
  .cell.done:hover{ transform:none; background:transparent; box-shadow:none; }
  .cell.active-cell{
    animation: glowPulse 1.5s ease-in-out infinite;
  }

  .skeleton-block{
    background: linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 50%, var(--panel) 75%) !important;
    background-size:200% 100% !important;
    animation: skeletonShine 1.4s ease-in-out infinite !important;
    color: transparent !important;
    cursor: default !important;
  }
  .skel-row{ height:38px; border-radius:7px; margin-bottom:9px; }

  .board-lock{
    position:absolute; inset:0;
    background: rgba(9,7,20,0.88);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:24px; z-index:5;
    animation: fadeIn .3s ease;
  }
  .lock-icon{ font-size:30px; }
  .lock-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; }
  .lock-sub{ color: var(--muted); font-size:13px; max-width:320px; }
  .lock-sub b{ color: var(--gold); font-family:'IBM Plex Mono', monospace; letter-spacing:1px; }

  .sidebar{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:13px;
    padding:18px;
    animation: fadeInUp .5s ease .16s both;
  }
  .sidebar h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color: var(--muted);
    margin: 0 0 13px;
  }
  .player-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size:16px;
    border-radius:6px;
  }
  .player-row:last-child{ border-bottom:none; }
  .player-row.leader{ border-left: 3px solid var(--gold); padding-left:11px; }
  .player-name{ display:flex; align-items:center; gap:9px; min-width:0; }
  .player-name > span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .player-rank{ width:14px; flex-shrink:0; color: var(--muted); font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .you-tag{ color: var(--muted); font-size:11px; font-weight:400; }
  .player-score{ font-family:'IBM Plex Mono', monospace; font-weight:600; color: var(--gold); border-radius:4px; padding: 2px 7px; flex-shrink:0; }
  .player-score.pop{ animation: scorePop .7s ease; }
  .reset-btn{
    margin-top:15px; width:100%;
    background:transparent; color: var(--muted);
    border:1px solid var(--line); border-radius:8px;
    padding:9px; font-size:12px; cursor:pointer;
    transition: all .15s;
  }
  .reset-btn:hover{ color: var(--text); border-color: var(--gold); transform: translateY(-1px); }

  .chat-section{ margin-top:20px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.06); }
  .chat-section h2{ margin-bottom:10px; }
  .chat-messages{
    display:flex; flex-direction:column; gap:9px;
    min-height:220px; max-height:440px; overflow-y:auto; padding-right:2px; margin-bottom:10px;
    scrollbar-width: thin;
  }
  .chat-messages::-webkit-scrollbar{ display:block; width:6px; }
  .chat-messages::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
  .chat-msg{ display:flex; gap:8px; align-items:flex-start; animation: fadeInUp .25s ease both; }
  .chat-msg.system{ justify-content:center; text-align:center; color: var(--muted); font-size:12px; padding:2px 0; }
  .chat-msg.system .chat-msg-system-text{ font-family:'Inter',sans-serif; }
  .chat-msg.system .chat-msg-system-text b{ color: var(--cyan); font-weight:600; }
  .chat-msg .player-avatar{ width:24px; height:24px; font-size:12px; margin-top:1px; }
  .chat-msg-body{ min-width:0; flex:1; }
  .chat-msg-head{ display:flex; align-items:baseline; gap:6px; }
  .chat-msg-name{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12px; color: var(--text); }
  .chat-msg-name.me{ color: var(--gold); }
  .chat-msg-time{ font-size:10px; color: var(--muted); }
  .chat-msg-text{ font-size:13.5px; line-height:1.4; color: var(--text); word-break:break-word; white-space:pre-wrap; }
  .chat-input-row{ display:flex; gap:7px; min-width:0; }
  .chat-input-row input{
    flex:1; min-width:0; width:0; padding:9px 12px; border-radius:8px; border:1px solid var(--line);
    background: var(--panel-2); color:var(--text); font-size:13.5px;
    font-family:'Inter',sans-serif;
    transition: border-color .15s, box-shadow .15s;
  }
  .chat-input-row input:focus{ outline:none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,183,5,0.15); }
  .chat-input-row .btn{ padding:9px 14px; font-size:15px; flex-shrink:0; }

  .overlay{
    position: fixed; inset:0;
    background: rgba(8,6,20,0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index: 50; padding: 20px;
    animation: fadeIn .25s ease;
  }
  .modal{
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px;
    width: 100%; max-width: 600px;
    max-height: 90vh; overflow-y: auto;
    text-align:center;
    animation: modalPop .3s cubic-bezier(.2,.8,.3,1.2);
  }
  .modal.wide{ max-width: 860px; }
  .join-head{ text-align:left; }
  .modal-kicker{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12px;
    text-transform:uppercase; letter-spacing:1.5px; color: var(--gold); margin-bottom:8px;
  }
  .join-head h2{ text-align:left; }
  .join-head p{ text-align:left; }
  .modal.correct-glow{ box-shadow: 0 0 0 2px var(--gold), 0 0 40px rgba(242,183,5,0.3); }
  .confetti-piece{
    position:absolute; top:0; width:8px; height:14px; border-radius:2px;
    animation: confettiFall 1.3s ease-in forwards;
  }
  .modal h2{
    font-family:'Space Grotesk', sans-serif;
    font-size: 25px; margin: 0 0 6px;
  }
  .modal p{ color: var(--muted); font-size:15px; margin: 0 0 20px; line-height:1.5; }
  .clue-value{
    font-family:'IBM Plex Mono', monospace;
    color: var(--gold); font-size: 17px; margin-bottom: 10px;
  }
  .clue-cat{ color: var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;}
  .clue-text{
    font-family:'Space Grotesk', sans-serif;
    font-size: 25px; line-height:1.4; margin: 10px 0 22px;
    animation: fadeInUp .35s ease .05s both;
  }
  .answer-text{
    font-size: 20px; color: var(--cyan); margin: 0 0 18px;
    font-family:'Space Grotesk', sans-serif;
    animation: popIn .35s ease both;
  }
  .result-msg{
    font-size:14px; margin: 0 0 18px; color: var(--gold); font-weight:500;
    animation: fadeInUp .3s ease both;
  }
  .buzz-btn{
    width: 114px; height:114px; border-radius:50%;
    background: var(--magenta); color:#fff; border:none;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px;
    cursor:pointer;
    box-shadow: 0 0 0 6px rgba(255,61,129,0.15);
    animation: pulse 1.6s infinite;
    transition: transform .12s;
  }
  .buzz-btn:hover{ transform: scale(1.05); }
  .buzz-btn:active{ transform: scale(0.94); }
  .buzz-btn:disabled{ background: var(--muted); box-shadow:none; animation:none; cursor:default; }
  .buzzed-info{ font-size:15px; margin-bottom:16px; animation: fadeInUp .3s ease both; }
  .buzzed-info b{ color: var(--gold); }

  .answer-form{ display:flex; gap:8px; margin-bottom:18px; animation: fadeInUp .3s ease both; }
  .answer-form input{
    flex:1; padding:11px 13px; border-radius:8px; border:1px solid var(--line);
    background: var(--panel-2); color:var(--text); font-size:16px;
    font-family:'Inter',sans-serif;
    transition: border-color .15s, box-shadow .15s;
  }
  .answer-form input:focus{ outline:none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,183,5,0.15); }

  .row-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn{
    font-family:'Inter',sans-serif; font-weight:500; font-size:16px;
    padding: 12px 22px; border-radius:8px; cursor:pointer; border:1px solid var(--line);
    background: var(--panel-2); color: var(--text);
    transition: transform .12s, filter .12s, border-color .12s;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.gold{ background: var(--gold); color:#1a1400; border:none; font-weight:700; }
  .btn.cyan{ background: var(--cyan); color:#04342c; border:none; font-weight:700; }
  .btn.ghost{ background:transparent; color:var(--muted); font-size:12px; padding:6px 12px; }
  .btn:hover{ filter: brightness(1.1); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0) scale(0.97); }
  .btn:disabled{ opacity:.6; cursor:default; transform:none !important; filter:none !important; }
  .btn-spinner{
    display:inline-block; width:12px; height:12px; flex-shrink:0;
    border:2px solid rgba(26,20,0,0.3); border-top-color:#1a1400;
    border-radius:50%; animation: spin .6s linear infinite;
  }

  input.name-input{
    width:100%; padding:14px 16px; border-radius:9px; border:1px solid var(--line);
    background: var(--panel-2); color:var(--text); font-size:17px; margin-bottom:14px;
    font-family:'Inter',sans-serif;
    transition: border-color .15s, box-shadow .15s;
  }
  input.name-input:focus{ outline:none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,183,5,0.15); }
  input.name-input:disabled{ opacity:.55; cursor:not-allowed; }
  .field-label{ text-align:left; font-size:12px; color:var(--muted); margin: 0 0 7px; text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; gap:6px; }
  .room-row{ display:flex; gap:8px; margin-bottom:4px; align-items:center; }
  .room-row input{ flex:1; text-transform:uppercase; letter-spacing:2px; text-align:center; font-family:'IBM Plex Mono', monospace; cursor:pointer; }
  .room-code-boxes{
    display:flex; gap:9px;
    filter: blur(7px);
    transition: filter .18s ease;
  }
  .room-code-boxes:hover, .room-code-boxes:focus-within{ filter: blur(0); }
  .room-box{
    width:56px; height:56px; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600;
    text-transform:uppercase; color: var(--gold);
    background: var(--panel-2); border:1px solid var(--line); border-radius:10px;
    cursor:text;
    transition: border-color .15s, box-shadow .15s;
  }
  .room-box:focus{ outline:none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,183,5,0.15); }
  .copy-feedback{ font-size:11px; color: var(--cyan); text-align:left; min-height:14px; margin:0 0 10px; opacity:0; transition:opacity .2s; }
  .copy-feedback.show{ opacity:1; }
  .dice-btn{
    background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color: var(--text); width:46px; height:46px; cursor:pointer; font-size:17px;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition: transform .2s, border-color .15s, color .15s;
  }

// Shared room state now lives in Firestore (collection "rooms", one doc per room
// code) so different browsers/devices actually see each other's moves. Personal
// per-device data (the "me" profile) stays in localStorage — it never needs to
// be shared, so there's no reason to burn a Firestore read/write on it.
// Firestore doesn't allow arrays nested directly inside arrays (this game's
// state has array-of-array fields like `answered` and `resolved`), so the
// whole state is serialized to a JSON string and stored under one field
// instead of being written as native Firestore fields.
async function fsGetRoom(roomCode){
  try{
    const snap = await getDoc(doc(db, 'rooms', roomCode));
    window.__fsClearError();
    if(!snap.exists()) return null;
    const raw = snap.data();
    return raw && raw.json ? JSON.parse(raw.json) : null;
  }catch(e){ console.error('firestore get failed', e); showFbError(e); return null; }
}
async function fsSetRoom(roomCode, value){
  try{ await setDoc(doc(db, 'rooms', roomCode), { json: JSON.stringify(value) }); window.__fsClearError(); }catch(e){ console.error('firestore set failed', e); showFbError(e); }
}
// Atomic read-modify-write: two players joining (or acting) within the same
// instant both read the doc, mutate it, and write it back — without this,
// whoever writes last silently overwrites the other's change (this is exactly
// what caused players to appear "alone" when joining at the same time).
// updater receives the current parsed state (or null if the doc doesn't exist
// yet) and returns the new state to persist.
async function fsTransactRoom(roomCode, updater){
  const ref = doc(db, 'rooms', roomCode);
  let result;
  try{
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      const current = snap.exists() && snap.data().json ? JSON.parse(snap.data().json) : null;
      const next = updater(current);
      if(next === undefined){ result = current; return; } // no-op: nothing to write
      result = next;
      tx.set(ref, { json: JSON.stringify(next) });
    });
    window.__fsClearError();
  }catch(e){ console.error('firestore transaction failed', e); showFbError(e); }
  return result;
}

let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function playTone(freq, duration, type, gainVal, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainVal || 0.12, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
function playSound(name){
  switch(name){
    // Neutral UI tap: single short, soft blip.
    case 'click': playTone(600, 0.045, 'sine', 0.06); break;
    // Opening a clue: a bright two-note "ding-dong" rising chime, distinct triangle timbre.
    case 'select': playTone(523, 0.09, 'triangle', 0.1); playTone(784, 0.13, 'triangle', 0.09, 0.07); break;
    // Buzzing in: low, harsh, percussive sawtooth "buzzer" hit — nothing else sounds like this.
    case 'buzz': playTone(150, 0.05, 'square', 0.16); playTone(120, 0.18, 'sawtooth', 0.14, 0.03); break;
    // Correct answer: cheerful three-note major arpeggio climbing up.
    case 'correct': playTone(523, 0.09, 'sine', 0.12); playTone(659, 0.1, 'sine', 0.12, 0.08); playTone(880, 0.2, 'sine', 0.13, 0.16); break;
    // Wrong answer: a dull, descending two-note "womp womp" on a detuned square wave.
    case 'incorrect': playTone(200, 0.16, 'square', 0.1); playTone(140, 0.28, 'square', 0.1, 0.14); break;
    // Copy-to-clipboard: single crisp high click, quicker/higher than the generic click.
    case 'copy': playTone(1100, 0.035, 'sine', 0.06); break;
    // Joining a room: a longer ascending three-note fanfare.
    case 'join': playTone(392, 0.09, 'triangle', 0.1); playTone(587, 0.1, 'triangle', 0.1, 0.08); playTone(784, 0.16, 'triangle', 0.1, 0.17); break;
    // New chat message: a soft two-note "pop" notification, mid-range sine.
    case 'chat': playTone(700, 0.05, 'sine', 0.07); playTone(950, 0.07, 'sine', 0.06, 0.06); break;
    default: playTone(500, 0.07, 'sine', 0.08);
  }
}

  const perGroup = Math.ceil(categoryIndices.length / roundsCount);
  const groups = [];
  for(let i = 0; i < categoryIndices.length; i += perGroup){
    groups.push(categoryIndices.slice(i, i + perGroup));
  }
  return groups;
}

function freshBoardState(config){
  return {
    config: config,
    answered: CATEGORIES.map(c => c.clues.map(() => false)),
    resolved: CATEGORIES.map(c => c.clues.map(tier => Math.floor(Math.random() * tier.pool.length))),
    scores: {},
    active: null,
    round: 0,
    started: false,
    chat: []
  };
}

// Picks the clue variant chosen for this room/game for a given category+row.
// state.resolved stores one random pool-index per cell so every player in the
// room sees the exact same clue, while different games/rooms get variety.
function getClue(s, ci, row){
  const tier = CATEGORIES[ci].clues[row];
  const picks = s && s.resolved && s.resolved[ci];
  const idx = (picks && typeof picks[row] === 'number' && tier.pool[picks[row]]) ? picks[row] : 0;
  const variant = tier.pool[idx] || tier.pool[0];
  return { value: tier.value, clue: variant.clue, answer: variant.answer };
}

function newActive(cat, row, autoBuzzId){
  return {
    cat, row,
    buzzed: autoBuzzId || null,
    tried: [],

  };
}

// Fills in fields that may be missing on state loaded from an older session,
// so older rooms don't crash when new features (clue variants, chat) are added.
function migrateState(s){
  if(!s) return s;
  if(!Array.isArray(s.resolved) || s.resolved.length !== CATEGORIES.length){
    s.resolved = CATEGORIES.map(c => c.clues.map(tier => Math.floor(Math.random() * tier.pool.length)));
  }
  if(!Array.isArray(s.chat)) s.chat = [];
  return s;
}

// Every action that changes shared game state goes through here. It uses a
// Firestore transaction so the read-mutate-write is atomic — critical for a
// buzzer game, since two players can buzz in at the very same instant and
// only a true atomic transaction guarantees exactly one of them wins.
async function mutateState(mutator){
  if(!state) return false;
  let applied = false;
  const next = await fsTransactRoom(room, (current) => {
    const fresh = migrateState(current) || state;
    applied = mutator(fresh);
    return applied ? fresh : undefined;
  });
  if(next){
    state = next;
    renderAll();
  }
  return applied;
}

async function ensureJoined(rawConfig){
  let nameConflict = false;
  const s = await fsTransactRoom(room, (current) => {
    let next = migrateState(current);
    const isValid = next && Array.isArray(next.answered) && next.answered.length === CATEGORIES.length &&
                     next.config && Array.isArray(next.config.rounds) && next.config.rounds.length > 0;
    if(!isValid){
      const rounds = splitRounds(rawConfig.categoryIndices, rawConfig.roundsCount);
      const fresh = freshBoardState({ mode: rawConfig.mode, rounds });
      if(next && next.scores) fresh.scores = next.scores;
      next = fresh;
    }
    if(typeof next.round !== 'number') next.round = 0;
    if(!next.scores[me.id]){
      const wantedName = (me.name || '').trim().toLowerCase();
      const taken = Object.entries(next.scores).some(([id, p]) => id !== me.id && (p.name || '').trim().toLowerCase() === wantedName);
      if(taken){
        nameConflict = true;
        return undefined; // abort: no write, name already used by another player in this room
      }
      next.scores[me.id] = { name: me.name, color: me.color, avatar: me.avatar, score: 0 };
      if(!Array.isArray(next.chat)) next.chat = [];
      next.chat.push({ id: uid(), type: 'system', playerId: me.id, name: me.name, text: 'a rejoint la partie', ts: Date.now() });
      if(next.chat.length > 60) next.chat = next.chat.slice(-60);
    }
    return next;
  });
  return { state: s, nameConflict };
}

async function copyToClipboard(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

function normalizeText(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function stripLeadingArticles(s){
  let prev;
  do{
    prev = s;
    s = s.replace(/^(le|la|les|l|un|une|des|du|de|au|aux)\s+/,'');
  } while(s !== prev);
  return s;
}

function extractCore(answer){
  let a = answer.replace(/\?+\s*$/,'').trim();
  a = a.replace(/^qu[' ]?est[- ]ce que\s+/i,'');
  a = a.replace(/^qu[' ]?est[- ]ce qui\s+/i,'');
  a = a.replace(/^qui est\s+/i,'');
  a = a.replace(/^qui sont\s+/i,'');
  let core = normalizeText(a);
  core = stripLeadingArticles(core);
  return core;
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}

function checkAnswer(userInput, correctAnswer){
  const core = extractCore(correctAnswer);
  let user = normalizeText(userInput);
  user = stripLeadingArticles(user);
  if(!user) return false;
  if(user === core) return true;
  // ignore missing/extra spaces (e.g. "world war" vs "worldwar")
  if(user.replace(/\s+/g,'') === core.replace(/\s+/g,'')) return true;
  if(core.length > 3 && (user.includes(core) || core.includes(user)) && user.length >= core.length * 0.4) return true;
  const dist = levenshtein(user, core);
  const threshold = Math.max(2, Math.ceil(core.length * 0.3));
  if(dist <= threshold) return true;
  // word-level fallback: for multi-word answers, accept if most significant words match closely
  const coreWords = core.split(' ').filter(w => w.length > 2);
  if(coreWords.length > 1){
    const userWords = user.split(' ').filter(Boolean);
    let matched = 0;
    coreWords.forEach(cw => {
      const ok = userWords.some(uw => uw === cw || levenshtein(uw, cw) <= Math.max(1, Math.ceil(cw.length * 0.3)));
      if(ok) matched++;
    });
    if(matched / coreWords.length >= 0.7) return true;
  }
  return false;
}

function renderBoard(){
  const board = document.getElementById('board');
  const catIdx = currentCategories();
  const cats = catIdx.map(ci => ({ idx: ci, title: CATEGORIES[ci].title, clues: CATEGORIES[ci].clues }));
  const sig = state.round + ':' + catIdx.join(',');

  if(boardSig !== sig){
    boardSig = sig;
    let html = '';
    cats.forEach((c, i) => {
      html += '<div class="cat" style="--accent:' + CATEGORY_ACCENTS[i % CATEGORY_ACCENTS.length] + '; animation-delay:' + (i*0.05) + 's">' + escapeHtml(c.title) + '</div>';
    });
    for(let row = 0; row < 5; row++){
      cats.forEach((c, i) => {
        const delay = (0.15 + (row*cats.length + i)*0.02);
        html += '<div class="cell" style="animation-delay:' + delay + 's" data-cat="' + c.idx + '" data-row="' + row + '">' + c.clues[row].value + '</div>';
      });
    }
    const n = Math.max(cats.length,1);
    const colW = n <= 5 ? 150 : n === 6 ? 136 : n === 7 ? 122 : 108;
    board.classList.toggle('compact', n >= 7);
    board.style.gridTemplateColumns = 'repeat(' + n + ', minmax(' + colW + 'px,1fr))';
    board.style.minWidth = (n * (colW + 12)) + 'px';
    board.innerHTML = html;
    board.querySelectorAll('.cell').forEach(cell => {
      cell.addEventListener('click', () => {
        if(cell.classList.contains('done')) return;
        selectClue(parseInt(cell.dataset.cat, 10), parseInt(cell.dataset.row, 10));
      });
    });
  }

  board.querySelectorAll('.cell').forEach(cell => {
    const ci = parseInt(cell.dataset.cat, 10);
    const row = parseInt(cell.dataset.row, 10);
    const done = state.answered[ci][row];
    const active = !!(state.active && state.active.cat === ci && state.active.row === row);
    if(done && !cell.classList.contains('done')){
      cell.classList.add('done');
      cell.textContent = '';
    } else if(!done && cell.classList.contains('done')){
      cell.classList.remove('done');
      cell.textContent = CATEGORIES[ci].clues[row].value;
    }
    cell.classList.toggle('active-cell', active);
  });

  const playerCount = Object.keys(state.scores).length;
  const locked = state.config.mode === 'duel' && playerCount < 2;
  const lockEl = document.getElementById('boardLock');
  lockEl.style.display = locked ? 'flex' : 'none';
  if(locked) document.getElementById('lockRoomCode').textContent = room;

  renderRoundBanner();
}

function renderScores(){
  const el = document.getElementById('scores');
  const players = Object.entries(state.scores).map(([id, p]) => ({ id, ...p }));
  if(players.length === 0){
    el.innerHTML = '<div class="empty-note">Aucun joueur pour l\'instant.</div>';
    return;
  }
  players.sort((a,b) => b.score - a.score);
  const topScore = players[0].score;
  el.innerHTML = players.map((p, i) => {
    const isLeader = p.score > 0 && p.score === topScore;
    return '<div class="player-row' + (isLeader ? ' leader' : '') + '">' +
        '<div class="player-name">' +
          '<span class="player-rank">' + (i+1) + '</span>' +
          '<span class="player-avatar" style="background:' + p.color + '">' + escapeHtml(avatarGlyph(p)) + '</span>' +
          '<span>' + escapeHtml(p.name) + (p.id === me.id ? ' <span class="you-tag">(vous)</span>' : '') + (isLeader ? ' 👑' : '') + '</span>' +
        '</div>' +
        '<div class="player-score" data-id="' + p.id + '">' + p.score + '</div>' +
      '</div>';
  }).join('');

  players.forEach(p => {
    const prev = prevScores[p.id];
    if(prev !== undefined && prev !== p.score){
      const scoreEl = el.querySelector('.player-score[data-id="' + p.id + '"]');
      if(scoreEl){
        scoreEl.classList.add('pop');
        setTimeout(() => scoreEl.classList.remove('pop'), 700);
      }
    }
    prevScores[p.id] = p.score;
  });
}

function renderOverlay(){
  const layer = document.getElementById('overlayLayer');

  if(!state.active){
    if(overlaySig !== 'none'){
      layer.innerHTML = '';
      overlaySig = 'none';
      lastCelebratedKey = null;
    }
    return;
  }

  const a = state.active;
  const sig = [a.cat, a.row, a.buzzed, a.tried.join(','), a.decided, a.correct, a.resultMsg, a.revealed].join('|');
  if(sig === overlaySig) return;
  overlaySig = sig;

  const existingInput = document.getElementById('answerInput');
  const preservedValue = existingInput ? existingInput.value : null;
  const hadFocus = existingInput === document.activeElement;
  const caretPos = existingInput ? existingInput.selectionStart : null;

  const clue = getClue(state, a.cat, a.row);
  const buzzedPlayer = a.buzzed ? state.scores[a.buzzed] : null;
  const iBuzzed = a.buzzed === me.id;
  const alreadyTried = a.tried.includes(me.id);
  const questionKey = a.cat + '-' + a.row;

  let bodyHtml =
    '<div class="clue-cat">' + escapeHtml(CATEGORIES[a.cat].title) + '</div>' +
    '<div class="clue-value">' + clue.value + ' points</div>' +
    '<div class="clue-text">' + escapeHtml(clue.clue) + '</div>';

  if(a.resultMsg){
    bodyHtml += '<div class="result-msg">' + escapeHtml(a.resultMsg) + '</div>';
  }
  if(a.revealed){
    bodyHtml += '<div class="answer-text">' + escapeHtml(revealAnswer(clue.answer)) + '</div>';
  }

  if(a.decided){
    bodyHtml += '<div class="row-actions"><button class="btn gold" id="closeBtn">Question suivante</button></div>';
  } else if(!a.buzzed){
    if(alreadyTried){
      bodyHtml += '<div class="buzzed-info">Vous avez déjà tenté cette question, à un autre de buzzer.</div>';
    } else {
      bodyHtml += '<button class="buzz-btn" id="buzzBtn">BUZZ</button>';
    }
    bodyHtml += '<div class="row-actions" style="margin-top:18px;"><button class="btn ghost" id="skipBtn">Passer la question</button></div>';
  } else if(iBuzzed){
    bodyHtml +=
      '<div class="buzzed-info">C\'est à vous ! Tapez votre réponse.</div>' +
      '<div class="answer-form"><input type="text" id="answerInput" placeholder="Votre réponse" autocomplete="off" /><button class="btn cyan" id="submitBtn">Valider</button></div>' +
      '<div class="row-actions"><button class="btn ghost" id="skipBtn">Passer la question</button></div>';
  } else {
    bodyHtml +=
      '<div class="buzzed-info"><b>' + escapeHtml(buzzedPlayer ? buzzedPlayer.name : '?') + '</b> réfléchit à sa réponse...</div>' +
      '<div class="row-actions">' +
        '<button class="btn ghost" id="forceCorrectBtn">Forcer correct</button>' +
        '<button class="btn ghost" id="forceIncorrectBtn">Forcer incorrect</button>' +
        '<button class="btn ghost" id="skipBtn">Passer</button>' +
      '</div>';
  }

  const showConfetti = a.decided && a.correct && lastCelebratedKey !== questionKey;
  layer.innerHTML = '<div class="overlay"><div class="modal' + (a.decided && a.correct ? ' correct-glow' : '') + '" id="modalBox">' + bodyHtml + '</div></div>';

  if(showConfetti){
    lastCelebratedKey = questionKey;
    spawnConfetti(document.getElementById('modalBox'));
  }

  const buzzBtn = document.getElementById('buzzBtn');
  if(buzzBtn) buzzBtn.addEventListener('click', buzz);
  const submitBtn = document.getElementById('submitBtn');
  const answerInput = document.getElementById('answerInput');
  if(submitBtn){
    submitBtn.addEventListener('click', () => submitAnswer(answerInput.value));
    answerInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitAnswer(answerInput.value); });
    if(preservedValue !== null){
      answerInput.value = preservedValue;
      if(hadFocus){
        answerInput.focus();
        const pos = caretPos !== null ? caretPos : preservedValue.length;
        answerInput.setSelectionRange(pos, pos);
      }
    } else {
      answerInput.focus();
    }
  }
  const forceCorrectBtn = document.getElementById('forceCorrectBtn');
  if(forceCorrectBtn) forceCorrectBtn.addEventListener('click', () => forceDecision(true));
  const forceIncorrectBtn = document.getElementById('forceIncorrectBtn');
  if(forceIncorrectBtn) forceIncorrectBtn.addEventListener('click', () => forceDecision(false));
  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.addEventListener('click', skipQuestion);
  const closeBtn = document.getElementById('closeBtn');
  if(closeBtn) closeBtn.addEventListener('click', closeQuestion);
}

function processReactions(s){
  if(!s || !Array.isArray(s.reactions)) return;
  s.reactions.forEach(r => {
    if(!seenReactionIds.has(r.id)){
      seenReactionIds.add(r.id);
      spawnFloatingEmoji(r.emoji);
    }
  });
}

async function reactToGame(emoji){
  spawnFloatingEmoji(emoji);
  await mutateState(s => {
    if(!Array.isArray(s.reactions)) s.reactions = [];
    const reaction = { id: uid(), emoji, ts: Date.now() };
    s.reactions.push(reaction);
    const cutoff = Date.now() - 15000;
    s.reactions = s.reactions.filter(r => r.ts >= cutoff).slice(-30);
    seenReactionIds.add(reaction.id);
    return true;
  });
}

  return hh + ':' + mm;

function renderChat(){
  const el = document.getElementById('chatMessages');
  if(!el) return;
  if(!state){ el.innerHTML = ''; chatSig = null; return; }
  const msgs = Array.isArray(state.chat) ? state.chat : [];

  let hasNewChatFromOther = false;
  let hasNewJoin = false;
  msgs.forEach(m => {
    if(!seenChatIds.has(m.id)){
      seenChatIds.add(m.id);
      if(m.playerId !== me.id){
        if(m.type === 'system') hasNewJoin = true;
        else hasNewChatFromOther = true;
      }
    }
  });
  if(hasNewJoin) playSound('join');
  else if(hasNewChatFromOther) playSound('chat');

  const sig = msgs.map(m => m.id).join(',');
  if(chatSig === sig) return;
  chatSig = sig;

  if(msgs.length === 0){
    el.innerHTML = '<div class="empty-note">Aucun message pour l\'instant. Dites bonjour 👋</div>';
  } else {
    el.innerHTML = msgs.map(m => {
      if(m.type === 'system'){
        return '<div class="chat-msg system"><span class="chat-msg-system-text"><b>' + escapeHtml(m.name) + '</b> ' + escapeHtml(m.text) + '</span></div>';
      }
      const isMe = m.playerId === me.id;
      return '<div class="chat-msg">' +
        '<span class="player-avatar" style="background:' + m.color + '">' + escapeHtml(m.avatar || (m.name || '?').charAt(0).toUpperCase()) + '</span>' +
        '<div class="chat-msg-body">' +
          '<div class="chat-msg-head"><span class="chat-msg-name' + (isMe ? ' me' : '') + '">' + escapeHtml(m.name) + (isMe ? ' (vous)' : '') + '</span><span class="chat-msg-time">' + formatChatTime(m.ts) + '</span></div>' +
          '<div class="chat-msg-text">' + escapeHtml(m.text) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  el.scrollTop = el.scrollHeight;
}

async function sendChat(text){
  const trimmed = (text || '').trim();
  if(!trimmed || !state) return;
  const input = document.getElementById('chatInput');
  if(input) input.value = '';
  playSound('click');
  await mutateState(s => {
    if(!Array.isArray(s.chat)) s.chat = [];
    const msg = { id: uid(), playerId: me.id, name: me.name, color: me.color, avatar: me.avatar, text: trimmed.slice(0, 240), ts: Date.now() };
    s.chat.push(msg);
    if(s.chat.length > 60) s.chat = s.chat.slice(-60);
    seenChatIds.add(msg.id);
    return true;
  });
  if(input) input.focus();
}

async function selectClue(ci, row){
  if(!state || state.active) return; // cheap local guard to avoid a pointless round-trip
  await mutateState(s => {
    if(s.active) return false;
    if(s.answered[ci][row]) return false;
    const playerCount = Object.keys(s.scores).length;
    if(s.config.mode === 'duel' && playerCount < 2) return false;
    const solo = s.config.mode === 'solo';
    s.active = newActive(ci, row, solo ? me.id : null);
    s.started = true;
    playSound('select');
    return true;
  });
}

async function buzz(){
  await mutateState(s => {
    if(!s.active || s.active.buzzed) return false;
    if(s.active.tried.includes(me.id)) return false;
    s.active.buzzed = me.id;
    playSound('buzz');
    return true;
  });
}

async function submitAnswer(text){
  await mutateState(s => {
    if(!s.active || s.active.buzzed !== me.id) return false;
    const clue = getClue(s, s.active.cat, s.active.row);
    const correct = checkAnswer(text || '', revealAnswer(clue.answer));
    applyDecision(s, correct);
    return true;
  });
}

function applyDecision(s, correct){
  playSound(correct ? 'correct' : 'incorrect');
  const a = s.active;
  const clue = getClue(s, a.cat, a.row);
  const playerName = s.scores[a.buzzed] ? s.scores[a.buzzed].name : 'Le joueur';
  if(correct){
    if(s.scores[a.buzzed]) s.scores[a.buzzed].score += clue.value;
    s.answered[a.cat][a.row] = true;
    a.decided = true;
    a.correct = true;
    a.revealed = true;
    a.resultMsg = playerName + ' a trouvé la bonne réponse ! +' + clue.value;
  } else {
    a.tried.push(a.buzzed);
    a.buzzed = null;
    const totalPlayers = Object.keys(s.scores).length;
    if(s.config.mode === 'solo' || a.tried.length >= totalPlayers){
      s.answered[a.cat][a.row] = true;
      a.decided = true;
      a.correct = false;
      a.revealed = true;
      a.resultMsg = "Personne n'a trouvé la bonne réponse.";
    } else {
      a.resultMsg = playerName + " s'est trompé, à un autre de tenter sa chance.";
    }
  }
}

async function forceDecision(correct){
  await mutateState(s => {
    if(!s.active || !s.active.buzzed) return false;
    applyDecision(s, correct);
    return true;
  });
}

async function skipQuestion(){
  await mutateState(s => {
    if(!s.active) return false;
    const a = s.active;
    s.answered[a.cat][a.row] = true;
    a.decided = true;
    a.correct = false;
    a.revealed = true;
    a.resultMsg = 'Question passée.';
    playSound('click');
    return true;
  });
}

async function closeQuestion(){
  await mutateState(s => {
    s.active = null;
    playSound('click');
    return true;
  });
}

async function advanceRound(){
  await mutateState(s => {
    if(!s.config) return false;
    if(s.round >= s.config.rounds.length - 1) return false;
    s.round += 1;
    s.active = null;
    return true;
  });
}

async function switchToSolo(){
  await mutateState(s => {
    if(!s.config || s.config.mode === 'solo') return false;
    s.config.mode = 'solo';
    return true;
  });
}

async function resetGame(){
  if(!state) return;
  if(!confirm('Réinitialiser le plateau et les scores pour tous les joueurs de la salle ?')) return;
  await mutateState(s => {
    const config = s.config;
    const fresh = freshBoardState(config);
    Object.entries(s.scores).forEach(([id, p]) => {
      fresh.scores[id] = { name: p.name, color: p.color, avatar: p.avatar, score: 0 };
    });
    fresh.chat = s.chat || [];
    Object.keys(s).forEach(k => delete s[k]);
    Object.assign(s, fresh);
    prevScores = {};
    boardSig = null;
    return true;
  });
}

function pollLoop(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if(Date.now() < suppressPollUntil) return;
    const fresh = migrateState(await loadState());
    if(fresh){
      state = fresh;
      renderAll();
    }
  }, 1200);
}

function renderSkeleton(){
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = 'repeat(4, minmax(140px,1fr))';
  board.style.minWidth = '620px';
  let html = '';
  for(let i=0;i<4;i++) html += '<div class="cat skeleton-block">&nbsp;</div>';
  for(let r=0;r<5;r++){
    for(let i=0;i<4;i++) html += '<div class="cell skeleton-block" style="opacity:1;">&nbsp;</div>';
  }
  board.innerHTML = html;
  document.getElementById('scores').innerHTML =
    '<div class="skel-row skeleton-block"></div>' +
    '<div class="skel-row skeleton-block"></div>' +
    '<div class="skel-row skeleton-block"></div>';
}

function setJoinLoading(loading){
  const btn = document.getElementById('joinBtn');
  if(!btn) return;
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="btn-spinner"></span> Connexion…' : 'Rejoindre la salle';
}

function pickerMarkup(selAvatar, selColor){
  return '<div class="field-label">Avatar</div>' +
    '<div class="avatar-chips" id="avatarChips">' +
      EMOJI_AVATARS.map(e => '<button type="button" class="avatar-chip' + (e === selAvatar ? ' active' : '') + '" data-avatar="' + e + '">' + e + '</button>').join('') +
    '</div>' +
    '<div class="field-label">Couleur</div>' +
    '<div class="color-chips" id="colorChips">' +
      PALETTE.map(c => '<button type="button" class="color-chip' + (c === selColor ? ' active' : '') + '" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
    '</div>';
}

function bindPickers(profile){
  document.querySelectorAll('.avatar-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      profile.avatar = btn.dataset.avatar;
      document.querySelectorAll('.avatar-chip').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  document.querySelectorAll('.color-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      profile.color = btn.dataset.color;
      document.querySelectorAll('.color-chip').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
}

function showProfileEditor(){
  if(!me || (state && state.active)) return;
  const layer = document.getElementById('overlayLayer');
  const profile = { avatar: me.avatar || EMOJI_AVATARS[0], color: me.color };
  const locked = !!state;

  layer.innerHTML =
    '<div class="overlay"><div class="modal wide" style="animation: modalPop .35s cubic-bezier(.2,.8,.3,1.2);">' +
      '<h2>Mon profil</h2>' +
      '<div class="field-label">Votre pseudo</div>' +
      '<input type="text" class="name-input" id="editNameInput" maxlength="20" minlength="3" value="' + escapeHtml(me.name) + '"' + (locked ? ' disabled' : '') + ' />' +
      (locked ? '<div class="form-note">Vous êtes dans une salle : votre pseudo ne peut plus être modifié. Quittez la salle pour en choisir un autre.</div>' : '') +
      pickerMarkup(profile.avatar, profile.color) +
      '<div class="form-error" id="editFormError"></div>' +
      '<div class="row-actions">' +
        '<button class="btn ghost" id="editCancelBtn" type="button">Annuler</button>' +
        '<button class="btn gold" id="editSaveBtn" type="button">Enregistrer</button>' +
      '</div>' +
    '</div></div>';

  bindPickers(profile);
  const nameInput = document.getElementById('editNameInput');
  document.getElementById('editCancelBtn').addEventListener('click', () => { layer.innerHTML = ''; });
  document.getElementById('editSaveBtn').addEventListener('click', async () => {
    const name = locked ? me.name : nameInput.value.trim();
    if(!name){
      document.getElementById('editFormError').textContent = 'Entrez un pseudo.';
      return;
    }
    if(!locked && name.length < 3){
      document.getElementById('editFormError').textContent = 'Le pseudo doit contenir au moins 3 caractères.';
      return;
    }
    me = { ...me, name, avatar: profile.avatar, color: profile.color };
    await saveMe(me);
    if(state){
      await mutateState(s => {
        if(!s.scores[me.id]) return false;
        s.scores[me.id].name = me.name;
        s.scores[me.id].color = me.color;
        s.scores[me.id].avatar = me.avatar;
        return true;
      });
    }
    layer.innerHTML = '';
    renderAll();
  });
}

function showJoinPrompt(){
  renderSkeleton();
  const layer = document.getElementById('overlayLayer');
  const defaultRoom = randomRoomCode(4);
  const defaultName = me ? me.name : '';
  const hasLastRoom = me && me.lastRoom;

  let selectedMode = 'duel';
  let selectedRounds = 1;
  let selectedCategoryIndices = CATEGORIES.map((_, i) => i).slice(0, DEFAULT_CATEGORIES);
  const profile = {
    avatar: me && me.avatar ? me.avatar : EMOJI_AVATARS[Math.floor(Math.random()*EMOJI_AVATARS.length)],
    color: me && me.color ? me.color : PALETTE[Math.floor(Math.random()*PALETTE.length)]
  };

  layer.innerHTML =
    '<div class="overlay"><div class="modal wide" style="animation: modalPop .35s cubic-bezier(.2,.8,.3,1.2);">' +
      '<div class="join-head">' +
        '<div class="modal-kicker">Jeopardy+</div>' +
        '<h2>Nouvelle partie</h2>' +
        '<p>Entrez le même code que vos amis pour jouer ensemble, ou gardez celui généré pour créer une salle.<br>Si la salle existe déjà, ses réglages priment sur les vôtres.</p>' +
      '</div>' +
      '<div class="field-label">Code de salle</div>' +
      '<div class="room-row"><div class="room-code-boxes" id="roomBoxes" title="Survolez pour révéler">' +
        [0,1,2,3].map(i => '<input type="text" maxlength="1" class="room-box" data-idx="' + i + '" value="' + escapeHtml((defaultRoom[i] || '').toUpperCase()) + '" />').join('') +
      '</div><button class="dice-btn" id="copyRoomBtn" type="button" title="Copier le code">' + ICON_COPY + '</button><button class="dice-btn" id="diceBtn" type="button" title="Générer un nouveau code">' + ICON_REFRESH + '</button></div>' +
      '<div class="copy-feedback" id="roomCopyFeedback">Copié dans le presse-papiers !</div>' +
      (hasLastRoom ? '<div class="rejoin-hint" id="rejoinHint">Reprendre votre dernière salle : <b>' + escapeHtml(me.lastRoom) + '</b></div>' : '') +
      '<div class="field-label">Votre pseudo</div>' +
      '<input type="text" class="name-input" id="nameInput" placeholder="Votre pseudo" maxlength="20" minlength="3" value="' + escapeHtml(defaultName) + '" />' +
      pickerMarkup(profile.avatar, profile.color) +
      '<div class="field-label">Mode de jeu</div>' +
      '<div class="mode-options" id="modeOptions">' +
        '<button type="button" class="mode-opt active" data-mode="duel"><b>Duel</b><span>Avec buzzer, 2 joueurs ou plus</span></button>' +
        '<button type="button" class="mode-opt" data-mode="solo"><b>Solo</b><span>Sans buzzer, seul ou en coopératif</span></button>' +
      '</div>' +
      '<div class="field-label">Nombre de manches</div>' +
      '<div class="round-options" id="roundOptions">' +
        '<button type="button" class="round-opt active" data-rounds="1">1 manche</button>' +
        '<button type="button" class="round-opt" data-rounds="2">2 manches</button>' +
        '<button type="button" class="round-opt" data-rounds="3">3 manches</button>' +
      '</div>' +
      '<div class="field-label">Catégories <span class="cat-count" id="catCount"></span><button type="button" class="random-cats-btn" id="randomCatsBtn">🎲 Aléatoire</button></div>' +
      '<div class="cat-chips" id="catChips">' +
        CATEGORIES.map((c, i) => '<button type="button" class="cat-chip' + (i < DEFAULT_CATEGORIES ? ' active' : '') + '" data-idx="' + i + '">' + escapeHtml(c.title) + '</button>').join('') +
      '</div>' +
      '<div class="form-error" id="formError"></div>' +
      '<button class="btn gold" id="joinBtn" style="width:100%;">Rejoindre la salle</button>' +
      '<div class="build-credit">Créé par Frowst (@frowsttt) — 2026</div>' +
    '</div></div>';

  const nameInput = document.getElementById('nameInput');

  function getRoomBoxes(){ return Array.from(document.querySelectorAll('.room-box')); }
  function setRoomCode(code){
    const chars = (code || '').toUpperCase().split('');
    getRoomBoxes().forEach((b, i) => { b.value = chars[i] || ''; });
  }
  function getRoomCode(){
    return getRoomBoxes().map(b => b.value.trim().toUpperCase()).join('');
  }

  let roomCopyTimer = null;
  const doCopyRoomCode = async () => {
    const ok = await copyToClipboard(getRoomCode());
    playSound('copy');
    const fb = document.getElementById('roomCopyFeedback');
    fb.textContent = ok ? 'Copié dans le presse-papiers !' : 'Échec de la copie';
    fb.classList.add('show');
    const btn = document.getElementById('copyRoomBtn');
    if(ok && btn){
      btn.innerHTML = ICON_CHECK;
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = ICON_COPY; btn.classList.remove('copied'); }, 1300);
    }
    if(roomCopyTimer) clearTimeout(roomCopyTimer);
    roomCopyTimer = setTimeout(() => fb.classList.remove('show'), 1400);
  };

  getRoomBoxes().forEach((box, i, boxes) => {
    box.addEventListener('input', () => {
      box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(-1);
      if(box.value && i < boxes.length - 1){ boxes[i+1].focus(); boxes[i+1].select(); }
    });
    box.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !box.value && i > 0){ boxes[i-1].focus(); boxes[i-1].select(); }
      else if(e.key === 'ArrowLeft' && i > 0){ boxes[i-1].focus(); }
      else if(e.key === 'ArrowRight' && i < boxes.length - 1){ boxes[i+1].focus(); }
      else if(e.key === 'Enter') doJoin();
    });
  });

  document.getElementById('copyRoomBtn').addEventListener('click', doCopyRoomCode);
  document.getElementById('diceBtn').addEventListener('click', () => {
    setRoomCode(randomRoomCode(4));
    playSound('click');
  });
  if(hasLastRoom){
    document.getElementById('rejoinHint').addEventListener('click', () => {
      setRoomCode(me.lastRoom);
    });
  }
  bindPickers(profile);

  document.querySelectorAll('.mode-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMode = btn.dataset.mode;
      document.querySelectorAll('.mode-opt').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  document.querySelectorAll('.round-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedRounds = parseInt(btn.dataset.rounds, 10);
      document.querySelectorAll('.round-opt').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  function updateCatCount(){
    const n = selectedCategoryIndices.length;
    document.getElementById('catCount').textContent = '(' + n + '/' + MAX_CATEGORIES + ' sélectionnée' + (n > 1 ? 's' : '') + ')';
  }
  updateCatCount();
  document.querySelectorAll('.cat-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const pos = selectedCategoryIndices.indexOf(idx);
      if(pos >= 0){
        if(selectedCategoryIndices.length <= 1) return;
        selectedCategoryIndices.splice(pos, 1);
        btn.classList.remove('active');
      } else {
        if(selectedCategoryIndices.length >= MAX_CATEGORIES) return;
        selectedCategoryIndices.push(idx);
        btn.classList.add('active');
      }
      updateCatCount();
    });
  });
  document.getElementById('randomCatsBtn').addEventListener('click', () => {
    const pool = CATEGORIES.map((_, i) => i);
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    selectedCategoryIndices = pool.slice(0, Math.min(5, CATEGORIES.length));
    document.querySelectorAll('.cat-chip').forEach(btn => {
      const idx = parseInt(btn.dataset.idx, 10);
      btn.classList.toggle('active', selectedCategoryIndices.includes(idx));
    });
    updateCatCount();
    playSound('click');
  });

  const doJoin = async () => {
    const name = nameInput.value.trim();
    const roomCode = getRoomCode();
    const errEl = document.getElementById('formError');
    if(!name || !roomCode){
      errEl.textContent = 'Entrez un pseudo et un code de salle.';
      return;
    }
    if(name.length < 3){
      errEl.textContent = 'Le pseudo doit contenir au moins 3 caractères.';
      return;
    }
    if(selectedCategoryIndices.length < 2){
      errEl.textContent = 'Choisissez au moins 2 catégories.';
      return;
    }
    if(selectedCategoryIndices.length < selectedRounds){
      errEl.textContent = 'Choisissez au moins ' + selectedRounds + ' catégories pour ' + selectedRounds + ' manches.';
      return;
    }
    errEl.textContent = '';
    playSound('join');
    setJoinLoading(true);
    const id = me && me.id ? me.id : uid();
    me = { id, name, color: profile.color, avatar: profile.avatar, lastRoom: roomCode };
    await saveMe(me);
    room = roomCode;
    const result = await init({ mode: selectedMode, roundsCount: selectedRounds, categoryIndices: selectedCategoryIndices.slice() });
    if(result && result.nameConflict){
      const freshErr = document.getElementById('formError');
      if(freshErr) freshErr.textContent = 'Ce pseudo est déjà pris dans cette salle. Choisissez-en un autre.';
    }
  };
  document.getElementById('joinBtn').addEventListener('click', doJoin);
  nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doJoin(); });
}

async function init(rawConfig){
  document.getElementById('overlayLayer').innerHTML = '';
  resetRenderCaches();
  if(!me){
    me = await loadMe();
  }
  if(!me || !room){
    showJoinPrompt();
    return;
  }
  const result = await ensureJoined(rawConfig || { mode: 'duel', roundsCount: 1, categoryIndices: CATEGORIES.map((_,i)=>i).slice(0, DEFAULT_CATEGORIES) });
  if(result.nameConflict){
    room = null;
    showJoinPrompt();
    return { nameConflict: true };
  }
  state = result.state;
  Object.entries(state.scores).forEach(([id, p]) => { prevScores[id] = p.score; });
  (state.reactions || []).forEach(r => seenReactionIds.add(r.id));
  (state.chat || []).forEach(m => seenChatIds.add(m.id));
  renderAll();
  pollLoop();
  return { nameConflict: false };
}

document.getElementById('resetBtn').addEventListener('click', resetGame);
document.getElementById('soloSwitchBtn').addEventListener('click', switchToSolo);
document.querySelectorAll('.reaction-btn').forEach(btn => {
  btn.addEventListener('click', () => reactToGame(btn.dataset.emoji));
});
document.getElementById('chatSendBtn').addEventListener('click', () => {
  sendChat(document.getElementById('chatInput').value);
});
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); sendChat(document.getElementById('chatInput').value); }
});

renderSkeleton();
init();
</script>
